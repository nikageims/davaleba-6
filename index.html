<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>დათვლა</h1>
        <div id="display" class="display">0</div>
        <div class="buttons">
            <input type="number" id="customAmount" placeholder="აირჩიეთ რაოდენობა" class="input-field">
            <button onclick="increase()">მატება ➕</button>
            <button onclick="reset()">გაასუფთავება</button>
            <button onclick="decrease()">დაკლება ➖</button>

    </div>
    <script src="js/app.js"></script>
</body>
</html>
